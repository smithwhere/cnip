# Shadowrocket: 2026-09-23 15:10:30
[General]
# Stability-first profile: keep existing routing rules, harden DNS and transport behavior.
bypass-system = true
skip-proxy = 192.168.0.0/16, 10.0.0.0/8, 100.64.0.0/10, 172.16.0.0/12, localhost, *.local, captive.apple.com
tun-excluded-routes = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32, 239.255.255.250/32, ff02::fb/128

# Use two DoH resolvers with H3 disabled to reduce UDP/QUIC-related DNS stalls.
# Plain DNS entries provide a fast fallback path if DoH is temporarily unavailable.
dns-server = https://doh.pub/dns-query#no-h3, https://dns.alidns.com/dns-query#no-h3, 119.29.29.29, 223.5.5.5
fallback-dns-server = system

# Direct traffic uses the system resolver for better local/CDN routing.
dns-direct-system = true
# If direct resolution fails, allow Shadowrocket to retry through the proxy path.
dns-direct-fallback-proxy = true

# Intercept common hard-coded public DNS requests so apps cannot bypass the configured resolver path.
hijack-dns = 8.8.8.8:53, 8.8.4.4:53, 1.1.1.1:53, 1.0.0.1:53

# Keep IPv6 enabled for Wi-Fi/cellular compatibility, but prefer IPv4 when both are available.
ipv6 = true
prefer-ipv6 = false

# Block QUIC only on proxied connections. TCP/TLS fallback is usually more stable on nodes with weak UDP relay.
block-quic = all-proxy

# Stability-first behavior: if the selected node cannot relay UDP, send that UDP traffic directly instead of dropping it.
# If privacy / strict no-leak behavior is more important, change DIRECT back to REJECT.
udp-policy-not-supported-behaviour = DIRECT

# LAN / ICMP compatibility.
icmp-auto-reply = true
private-ip-answer = true

# Keep rewrite and local-host behavior conservative.
always-reject-url-rewrite = false
use-local-host-item-for-proxy = false

[Rule]
DOMAIN-SUFFIX,qq.com,DIRECT
DOMAIN-SUFFIX,qpic.cn,DIRECT
DOMAIN-SUFFIX,qlogo.cn,DIRECT
DOMAIN-SUFFIX,qq.com.cn,DIRECT
DOMAIN-SUFFIX,wechatpay.cn,DIRECT
DOMAIN-SUFFIX,tencent-cloud.net,DIRECT
DOMAIN-SUFFIX,aliapp.org,DIRECT
DOMAIN-SUFFIX,alicdn.com,DIRECT
DOMAIN-SUFFIX,alipay.com,DIRECT
DOMAIN-SUFFIX,alipayobjects.com,DIRECT
DOMAIN-SUFFIX,taobao.com,DIRECT
DOMAIN-SUFFIX,uc.cn,DIRECT
DOMAIN-SUFFIX,ucweb.com,DIRECT

[Host]
localhost = 127.0.0.1

[URL Rewrite]
'^https?://(www.)?g.cn($|/.*)' 'https://www.google.com$2' 302
'^https?://(www.)?google.cn($|/.*)' 'https://www.google.com$2' 302
